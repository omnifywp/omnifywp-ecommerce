<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blog Post Banners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #08100D;
    color: #FFFFFF;
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    width: 1200px;
    height: 675px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 44px 56px;
    background: #0B1913;
    page-break-after: always;
  }

  /* Grid overlay */
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(16, 185, 129, 0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .glow-radial {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: 0.35;
  }

  /* Header */
  .banner-top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }
  .brand-logo-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 900;
    color: #062014;
  }
  .category-pill {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pill-emerald { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .pill-blue { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
  .pill-amber { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
  .pill-purple { background: rgba(168, 85, 247, 0.15); color: #C084FC; border: 1px solid rgba(168, 85, 247, 0.3); }

  /* Body Content */
  .banner-body {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 36px;
    margin: auto 0;
  }
  .text-content {
    flex: 1;
    max-width: 600px;
  }
  .banner-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 38px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.03em;
    color: #F8FAFC;
    margin-bottom: 14px;
  }
  .banner-title span.highlight {
    background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .banner-desc {
    font-size: 16px;
    line-height: 1.5;
    color: #94A3B8;
  }

  /* Visual Preview Right Side */
  .visual-preview {
    flex-shrink: 0;
    width: 440px;
    position: relative;
  }
  .glass-card {
    background: rgba(15, 30, 23, 0.85);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-radius: 14px;
    padding: 20px 22px;
    backdrop-filter: blur(16px);
    box-shadow: 0 16px 36px -8px rgba(0,0,0,0.6);
  }

  /* Bottom stats / features */
  .banner-bottom {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 32px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stat-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #34D399;
    font-size: 14px;
  }
  .stat-info { display: flex; flex-direction: column; }
  .stat-label { font-size: 10px; text-transform: uppercase; color: #64748B; font-weight: 600; letter-spacing: 0.05em; }
  .stat-val { font-size: 14px; font-weight: 700; color: #E2E8F0; }

  /* Specific widgets inside cards */
  .code-snip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #A7F3D0;
  }
  .metric-badge {
    display: inline-flex;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px;
  }
  .metric-badge-good { background: rgba(16, 185, 129, 0.2); color: #34D399; }
  .metric-badge-bad { background: rgba(239, 68, 68, 0.2); color: #F87171; }
</style>
<style>html,body{margin:0;padding:0;overflow:hidden;width:1200px;height:675px;}</style></head>
<body>
<div class="banner" id="banner-1" style="background: radial-gradient(circle at 80% 20%, #0F3323 0%, #0B1913 70%);">
    <div class="grid-pattern"></div>
    <div class="glow-radial" style="right: 50px; top: -100px; background: #10B981;"></div>
    
    <div class="banner-top">
      <div class="brand-tag">
        <div class="brand-logo-mark">&#10003;</div>
        OmnifyWP Engine
      </div>
      <div class="category-pill pill-emerald">Architecture Teardown</div>
    </div>

    <div class="banner-body">
      <div class="text-content">
        <h1 class="banner-title">Why We Built OmnifyWP: The <span class="highlight">High-Speed</span> WooCommerce Alternative</h1>
        <p class="banner-desc">Eliminating wp_postmeta bottlenecks with 18 dedicated SQL tables, sub-15ms checkouts, and zero platform commissions.</p>
      </div>

      <div class="visual-preview">
        <div class="glass-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:12px; color:#64748B; font-weight:600;">
            <span>DATABASE BENCHMARK</span>
            <span style="color:#34D399;">InnoDB RELATIONAL</span>
          </div>
          <div style="background:rgba(255,255,255,0.03); border-radius:10px; padding:12px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.06);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span style="font-size:13px; color:#94A3B8;">Legacy postmeta</span>
              <span class="metric-badge metric-badge-bad">4,200ms latency</span>
            </div>
            <div style="height:6px; background:#334155; border-radius:3px; overflow:hidden;">
              <div style="width:88%; height:100%; background:#EF4444;"></div>
            </div>
          </div>
</body>
</html>
